<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css"> 
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Oswald:wght@600&display=swap" rel="stylesheet"> 
</head>
<body>
    <main class="container">
        <div class="cabecalho">
            <h1>Fale Conosco</h1>
            <p>Tem alguma dúvida ou sugestão? Entre em contato!</p>
        </div>

        <form>
            <div class="campo">
                <label for="name">Nome completo</label>
                <input type="text" id="nome">
            </div>

            <div class="campo">
                <label for="email">Seu melhor e-mail</label>
                <input type="email" id="email">
            </div>

            <div class="campo">
                <label for="assunto">Motivo do contato</label>
                <select id="assunto" name="assunto">
                    <option value="">Escolha uma opção</option>
                    <option value="informacoes">Solicitar informações</option>
                    <option value="parceria">Proposta de parceria</option>
                    <option value="outros">Outros assuntos</option>
                </select>
            </div>

            <div class="campo">
                <label for="mensagem">Sua mensagem</label>
                <textarea id="mensagem" name="mensagem">Escreva aqui sua mensagem.</textarea>
            </div>

            <button type="submit">Enviar mensagem</button>
        </form>
    </main>
</body>
</html>
